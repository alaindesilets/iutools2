org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home,/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home

# The project never set this explicitly, so Gradle's daemon defaulted to a
# small heap (512 MiB) -- fine until the Guess Meaning spike added the
# Anthropic SDK's dependency tree (OkHttp, Jackson, etc.), which pushed
# tasks like :composeApp:mergeExtDexDebug past that limit ("Daemon will
# expire immediately since the JVM garbage collector is thrashing").
org.gradle.jvmargs=-Xmx2048m
